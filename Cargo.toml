[package]
name = "labaclaw-worker-plane"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Worker-plane for LabaClaw dedicated agents on Kubernetes"
repository = "https://github.com/nauron-ai/labaclaw-worker-plane"

[lib]
doctest = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
k8s-openapi = { version = "0.24", features = ["v1_30"] }
kube = { version = "0.98", features = ["client", "rustls-tls"] }
object_store = { version = "0.12", features = ["aws"] }
rdkafka = { version = "0.37", features = ["tokio", "cmake-build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
